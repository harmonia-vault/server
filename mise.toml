[tools]
node = "24.16.0"
pnpm = "11.5.2"

[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.test]
run = "pnpm test"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.build]
run = "pnpm build"

[tasks."worker:build"]
run = "pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run"
env = { WRANGLER_SEND_METRICS = "false" }

[tasks.check]
depends = ["typecheck", "test", "build"]
