name: 更新服务

on:
  workflow_dispatch:
    inputs:
      version:
        description: 只在提示选择部署版本时填写
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'harmonia-vault/server' && github.ref_type == 'branch'
    uses: harmonia-vault/server/.github/workflows/sync-upstream-reusable.yml@main
    with:
      version: ${{ inputs.version }}
